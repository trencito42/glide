<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Sign in</title>
    <style>
      body {
        margin: 40px;
        font: 16px/1.45 "Segoe UI", sans-serif;
        background: #f7f5f2;
        color: #1e1b16;
      }
      form {
        display: grid;
        gap: 12px;
        max-width: 320px;
      }
      label {
        display: grid;
        gap: 4px;
      }
      input,
      button {
        font: inherit;
        padding: 8px 10px;
      }
    </style>
  </head>
  <body>
    <h1>Sign in</h1>
    <form>
      <label>Email <input id="email" name="email" type="email" autocomplete="username" /></label>
      <label>Password <input id="password" name="password" type="password" autocomplete="current-password" /></label>
      <button type="submit">Sign in</button>
    </form>
    <script>
      document.querySelector("form").addEventListener("submit", (event) => {
        event.preventDefault();
        document.title = "blocked-submit";
      });
    </script>
  </body>
</html>
